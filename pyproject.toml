[project]
name = "joke-api"
version = "0.1.0"
description = "FastAPI service that generates jokes on any topic using Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "groq>=1.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
joke-api = "joke_api.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joke_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
